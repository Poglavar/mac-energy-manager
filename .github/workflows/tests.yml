# The suite is pure awk/bash/python over TSV fixtures — no SwiftBar, no menu bar, no
# sampling — so it runs unmodified on a GitHub macOS runner in about a second.
name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: awk/bash suite
        run: test/run-tests.sh
      - name: alert trigger suite
        run: python3 test/test_advisor.py
      - name: attribution suite
        run: python3 test/test_attribution.py
      - name: shell syntax
        run: |
          for f in install.sh plugins/*.sh lib/*.sh bin/*; do
            head -1 "$f" | grep -q bash || continue
            bash -n "$f"
          done
